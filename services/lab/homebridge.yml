services:
  homebridge:
    x-target: apeach
    container_name: lab-homebridge
    image: homebridge/homebridge:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ENABLE_AVAHI: 0
      HOMEBRIDGE_CONFIG_UI_PORT: 9999
    volumes:
      - $CONFIG_ROOT/homebridge:/homebridge:rw
